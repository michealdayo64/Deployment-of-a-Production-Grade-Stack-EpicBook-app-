services:
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - front-tier
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: epicbook-frontend:1.0
    networks:
      - front-tier
    restart: unless-stopped

  backend:
    build: ./backend
    image: epicbook-backend:1.0
    environment:
      NODE_ENV: production
      PORT: "3001"
      JAWSDB_URL: mysql://${DB_USER}:${DB_PASSWORD}@database:3306/${DB_NAME}
    depends_on:
      - database
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  database:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/BuyTheBook_Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/author_seed.sql:/docker-entrypoint-initdb.d/02-authors.sql:ro
      - ./db/books_seed.sql:/docker-entrypoint-initdb.d/03-books.sql:ro
    networks:
      - back-tier
    restart: unless-stopped

networks:
  front-tier:
  back-tier:
    internal: true

volumes:
  db_data:
